# arch2ramos mkinitcpio configuration
# Builds an archiso-style initramfs that boots a squashfs from disk into RAM.
# Installed to: /etc/arch2ram/mkinitcpio.conf
# (Kept out of /etc/mkinitcpio.conf.d/ on purpose — that directory's drop-in
# mechanism is for augmenting /etc/mkinitcpio.conf, not for full configs like
# this one.)
#
# Hooks chosen:
#   base, udev          — core
#   plymouth            — boot splash; ALSO owns the framebuffer from early
#                         init so the KMS handoff to amdgpu/i915 is clean.
#                         Without this, on hybrid GPU systems the screen can
#                         freeze on the last text written to simple-framebuffer
#                         and KWin reports "no outputs" because the framebuffer
#                         transition never completed.
#   microcode           — load CPU microcode early
#   modconf, kms        — kernel modules + early KMS for video
#   keyboard            — keyboard at emergency shell
#   archiso             — mount squashfs + overlayfs + optional copytoram
#   block, filesystems  — block-device probing + fs autoload
#
# Dropped (vs. official archiso): memdisk, archiso_loop_mnt, archiso_pxe_*
#   We boot off a partition that holds airootfs.sfs directly — no .iso,
#   no PXE network boot.

MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev plymouth microcode modconf kms keyboard archiso block filesystems)
COMPRESSION="zstd"
