# arch2ramos hyprland wrapper config
# Imports user's existing setup + adds RAM-mode-specific overrides.
# In RAM mode the HDMI output is HDMI-A-5 (not HDMI-A-1 like on disk),
# so we add a matching monitor rule. Disk-mode is untouched.

source = /home/Guy008/.config/hypr/hyprland.conf

# RAM mode connector: amdgpu enumerates HDMI-A-5 here.
# Same settings as the user's HDMI-A-1 rule (4K + scale 3).
monitor = HDMI-A-5, 3840x2160@60, 0x0, 3
