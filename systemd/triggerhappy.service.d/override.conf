# arch2ramos override for triggerhappy.
#
# Reason: the upstream unit runs `thd --user nobody`. We need root because:
#   - the dispatcher (arch2ram-th-run) does `runuser` to drop into the user
#     session — only root can switch identities.
#   - Some triggers (like arch2ram-kill-foreground) need to inspect or
#     signal processes outside the nobody user's view.
#
# Drop the --user nobody by clearing ExecStart and re-defining it.
[Service]
ExecStart=
ExecStart=/usr/bin/thd --triggers /etc/triggerhappy/triggers.d/ --socket /run/thd.socket --deviceglob /dev/input/event*
