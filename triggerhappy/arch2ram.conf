# arch2ramos universal hotkeys -- kernel-level via evdev (triggerhappy)
# IMPORTANT: triggerhappy's parser chokes on blank lines, so this file
# packs comments + triggers tightly. Do not add empty lines.
#
# Format: <keys>  <state>  <command>
#   state 1 = press, 0 = release, 2 = repeat
# All user-facing commands go through /usr/local/bin/arch2ram-th-run which
# resolves the active graphical user + injects DISPLAY/XAUTHORITY/HOME and
# drops privileges via runuser. This way the same triggers work in every
# boot mode (gamescope, ES, cage, hyprland, tty).
# Hotkey convention: LEFTMETA (Win) is the "system" modifier (like Batocera).
# --- Help / discovery ---
KEY_F2+KEY_LEFTMETA    1  /usr/local/bin/arch2ram-th-run arch2ram-help
KEY_F1+KEY_LEFTMETA    1  /usr/local/bin/arch2ram-th-run nemo /home/Guy008
# --- Window / system tools ---
KEY_F3+KEY_LEFTMETA    1  /usr/local/bin/arch2ram-th-run arch2ram-mouse invert
KEY_F4+KEY_LEFTMETA    1  /usr/local/bin/arch2ram-th-run konsole
# --- Screenshots ---
KEY_F12+KEY_LEFTMETA   1  /usr/local/bin/arch2ram-th-run arch2ram-screenshot
KEY_SYSRQ              1  /usr/local/bin/arch2ram-th-run arch2ram-screenshot
# --- Volume (dedicated keys via amixer, no pulse daemon needed) ---
KEY_VOLUMEUP           1  /usr/local/bin/arch2ram-th-run amixer -q set Master 2%+ unmute
KEY_VOLUMEUP           2  /usr/local/bin/arch2ram-th-run amixer -q set Master 2%+ unmute
KEY_VOLUMEDOWN         1  /usr/local/bin/arch2ram-th-run amixer -q set Master 2%- unmute
KEY_VOLUMEDOWN         2  /usr/local/bin/arch2ram-th-run amixer -q set Master 2%- unmute
KEY_MUTE               1  /usr/local/bin/arch2ram-th-run amixer -q set Master toggle
# --- Volume Win+arrows (fallback) ---
KEY_UP+KEY_LEFTMETA    1  /usr/local/bin/arch2ram-th-run amixer -q set Master 5%+ unmute
KEY_DOWN+KEY_LEFTMETA  1  /usr/local/bin/arch2ram-th-run amixer -q set Master 5%- unmute
KEY_M+KEY_LEFTMETA     1  /usr/local/bin/arch2ram-th-run amixer -q set Master toggle
# --- Brightness (laptop backlight) ---
KEY_BRIGHTNESSUP       1  /usr/local/bin/arch2ram-th-run arch2ram-brightness +5
KEY_BRIGHTNESSDOWN     1  /usr/local/bin/arch2ram-th-run arch2ram-brightness -5
# --- Quick-launch apps ---
KEY_T+KEY_LEFTMETA     1  /usr/local/bin/arch2ram-th-run konsole
KEY_E+KEY_LEFTMETA     1  /usr/local/bin/arch2ram-th-run nemo /home/Guy008
KEY_B+KEY_LEFTMETA     1  /usr/local/bin/arch2ram-th-run google-chrome-stable
# --- Emergency: back to launcher (kills foreground app) ---
KEY_ESC+KEY_LEFTMETA   1  /usr/local/bin/arch2ram-th-run arch2ram-kill-foreground
