<?xml version="1.0"?>
<!--
  arch2ramos es_systems.cfg
  =========================
  Every system routes through `arch2ram-launch SYSTEM ROM`, which then
  picks the right runtime (gtk-launch / wine / retroarch+core / standalone
  emulator) and wraps it with runer.sh for max GPU/CPU acceleration.

  Adding a new system: drop ROMs into its <path>, ensure the matching
  emulator/core is installed, optionally add a case in arch2ram-launch.

  Categories appear in this order in ES (top → bottom of carousel).
-->
<systemList>

  <!-- ════════ Computing — apps, games, OS-as-launcher ════════ -->

  <system>
    <name>apps</name>
    <fullname>Apps</fullname>
    <path>/home/Guy008/ES/apps</path>
    <extension>.desktop</extension>
    <command>/usr/local/bin/arch2ram-launch apps %ROM%</command>
    <platform>pc</platform>
    <theme>apps</theme>
  </system>

  <system>
    <name>linux</name>
    <fullname>Linux Games</fullname>
    <path>/home/Guy008/ES/linux</path>
    <extension>.sh</extension>
    <command>/usr/local/bin/arch2ram-launch linux %ROM%</command>
    <platform>pc</platform>
    <theme>linux</theme>
  </system>

  <system>
    <name>windows</name>
    <fullname>Windows Games</fullname>
    <path>/home/Guy008/ES/windows</path>
    <extension>.sh .exe</extension>
    <command>/usr/local/bin/arch2ram-launch windows %ROM%</command>
    <platform>pc</platform>
    <theme>windows</theme>
  </system>

  <system>
