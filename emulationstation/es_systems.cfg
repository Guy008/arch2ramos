<?xml version="1.0"?>
<!--
  arch2ramos es_systems.cfg
  =========================
  4 categories, all populated by arch2ram-es-discover from real sources:

    Apps     ← /usr/share/applications/*.desktop (filtered: visible only)
              Includes Lutris exports, Steam game shortcuts, system apps
    Linux    ← /media/G/Linux/*/  (auto-detected entry point per game)
    Windows  ← /media/G/Windows/*/ (.exe via wine, biggest exe heuristic)
    Steam    ← Steam Big Picture as a single entry

  Launch chain:
    ES → command → /home/Guy008/Scripts/runer.sh wraps with mangohud +
    RADV/Vulkan env → exec target → returns to ES when target exits

  For .desktop files (Apps), command is gtk-launch which reads the
  Exec= line from the file. Lutris exports include full pre-game-mode
  setup, so launching from Apps gets the user's Lutris config.
-->
<systemList>

  <system>
    <name>apps</name>
    <fullname>Apps</fullname>
    <path>/home/Guy008/ES/apps</path>
    <extension>.desktop</extension>
    <command>/home/Guy008/Scripts/runer.sh gtk-launch %BASENAME%</command>
    <platform>pc</platform>
    <theme>apps</theme>
  </system>

  <system>
    <name>linux</name>
    <fullname>Linux Games</fullname>
    <path>/home/Guy008/ES/linux</path>
    <extension>.sh</extension>
    <command>/home/Guy008/Scripts/runer.sh %ROM%</command>
    <platform>pc</platform>
    <theme>linux</theme>
  </system>

  <system>
    <name>windows</name>
    <fullname>Windows Games</fullname>
    <path>/home/Guy008/ES/windows</path>
    <extension>.sh</extension>
    <command>/home/Guy008/Scripts/runer.sh %ROM%</command>
    <platform>pc</platform>
    <theme>windows</theme>
  </system>

  <system>
    <name>steam</name>
    <fullname>Steam</fullname>
    <path>/home/Guy008/ES/steam</path>
    <extension>.sh</extension>
    <command>/home/Guy008/Scripts/runer.sh %ROM%</command>
    <platform>steam</platform>
    <theme>steam</theme>
  </system>

</systemList>
