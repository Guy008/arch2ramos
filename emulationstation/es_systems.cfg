<?xml version="1.0"?>
<!--
  arch2ramos es_systems.cfg
  =========================
  Categories use the ES "system" abstraction. Files in each category's
  <path> appear as "games" in ES. Picking one runs <command> with %ROM%
  replaced by the file path. All categories funnel through runer.sh,
  which applies GPU/CPU/Vulkan optimization env vars before exec.

  Paths live under /home/Guy008/ES/ — a dedicated tree to avoid
  scanning user's other directories (which may contain recursive
  symlinks like Steam/umu compatdata).
-->
<systemList>

  <system>
    <name>games</name>
    <fullname>Games</fullname>
    <path>/home/Guy008/ES/games</path>
    <extension>.sh .desktop .x86_64 .AppImage</extension>
    <command>/home/Guy008/Scripts/runer.sh %ROM%</command>
    <platform>pc</platform>
    <theme>games</theme>
  </system>

  <system>
    <name>apps</name>
    <fullname>Apps</fullname>
    <path>/home/Guy008/ES/apps</path>
    <extension>.sh .desktop .x86_64 .AppImage</extension>
    <command>/home/Guy008/Scripts/runer.sh %ROM%</command>
    <platform>pc</platform>
    <theme>apps</theme>
  </system>

  <system>
    <name>tools</name>
    <fullname>Tools</fullname>
    <path>/home/Guy008/ES/tools</path>
    <extension>.sh .desktop</extension>
    <command>/home/Guy008/Scripts/runer.sh %ROM%</command>
    <platform>pc</platform>
    <theme>tools</theme>
  </system>

</systemList>
